<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dad: The Ultimate Bollywood Hero 🎬</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary: #ff0055;
      --gold: #ffd700;
      --bg: #0d0d11;
      --card-bg: #1a1a24;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      text-align: center;
      padding-bottom: 50px;
    }

    /* Header & Hero */
    header {
      padding: 50px 20px 30px;
      background: linear-gradient(180deg, #2a0845 0%, var(--bg) 100%);
    }

    .hero-title {
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--gold);
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
      margin-bottom: 10px;
    }

    .hero-subtitle {
      font-size: 1.2rem;
      color: #ccc;
    }

    /* Music Control Button */
    .bg-music-btn {
      margin: 25px auto 10px;
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: 700;
      background: linear-gradient(45deg, var(--primary), #ff5500);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .bg-music-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 0, 85, 0.6);
    }

    /* Section Styling */
    section {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 1.8rem;
      color: var(--gold);
      margin-bottom: 25px;
      position: relative;
      display: inline-block;
    }

    .section-title::after {
      content: '';
      display: block;
      width: 60%;
      height: 3px;
      background: var(--primary);
      margin: 8px auto 0;
      border-radius: 2px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid #2a2a3a;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    /* 6 Soundboard Buttons Grid */
    .sound-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .sound-btn {
      background: #252538;
      border: 2px solid var(--gold);
      color: white;
      padding: 15px 10px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sound-btn:hover {
      background: var(--gold);
      color: #000;
      transform: translateY(-3px);
    }

    /* Dynamic GIF Display Box */
    .gif-display-card {
      background: #11111a;
      border: 2px dashed var(--primary);
      border-radius: 12px;
      padding: 20px;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .gif-display-card img {
      max-width: 100%;
      max-height: 280px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      display: none;
    }

    .gif-caption {
      margin-top: 15px;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--gold);
    }

    /* Quiz Container */
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .quiz-btn {
      background: #28283d;
      color: #fff;
      border: 1px solid #444;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      text-align: left;
    }

    .quiz-btn:hover {
      background: #3b3b5c;
    }

    #quiz-feedback {
      margin-top: 15px;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .next-quiz-btn {
      margin-top: 20px;
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Footer */
    footer {
      margin-top: 60px;
      color: #888;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- Audio Elements (6 Catchphrases + 1 BGM) -->
  <audio id="bg-audio" loop><source src="audio/don-theme.mp3" type="audio/mpeg"></audio>
  <audio id="sound-1" src="audio/line-shuru.mp3"></audio>
  <audio id="sound-2" src="audio/principal.mp3"></audio>
  <audio id="sound-3" src="audio/shahenshah.mp3"></audio>
  <audio id="sound-4" src="audio/fire.mp3"></audio>
  <audio id="sound-5" src="audio/commitment.mp3"></audio>
  <audio id="sound-6" src="audio/don-namumkin.mp3"></audio>

  <!-- Hero Header -->
  <header>
    <h1 class="hero-title">Happy Birthday, Boss! 🎬</h1>
    <p class="hero-subtitle">"Jahan se Papa khade hote hain, celebration wahin se shuru hoti hai!"</p>
    <button class="bg-music-btn" onclick="toggleBGM()">▶ Play Hero Theme Music</button>
  </header>

  <!-- Soundboard & GIF Section (6 Boxes) -->
  <section>
    <h2 class="section-title">Dad Catchphrase Soundboard 🎙️</h2>
    <div class="card">
      <div class="sound-grid">
        <button class="sound-btn" onclick="playCatchphrase('sound-1', 'https://media.giphy.com/media/3ofT5PzgI9Ff2V21M4/giphy.gif', 'Jahan se hum khade hote hain, line wahin se shuru hoti hai!')">
          "Line Wahin Se..."
        </button>

        <button class="sound-btn" onclick="playCatchphrase('sound-2', 'https://media.giphy.com/media/l1IY72RgLqvWLipys/giphy.gif', 'Jis school mein tum padhte ho, uss school ka principal main hoon!')">
          "Uss School Ka Principal..."
        </button>

        <button class="sound-btn" onclick="playCatchphrase('sound-3', 'https://media.giphy.com/media/xT1R9Z8f7M2nK7tCne/giphy.gif', 'Rishte mein toh hum tumhare baap lagte hain!')">
          "Rishte Mein Toh Hum..."
        </button>

        <button class="sound-btn" onclick="playCatchphrase('sound-4', 'https://media.giphy.com/media/S5E6VIkBAGujjfT0zz/giphy.gif', 'Naam sunke flower samjhe kya? Fire hai main!')">
          "Flower Samjhe Kya? Fire!"
        </button>

        <button class="sound-btn" onclick="playCatchphrase('sound-5', 'https://media.giphy.com/media/3o6wrC51G8K3p7lT8I/giphy.gif', 'Ek baar jo maine commitment kar di, uske baad toh main khud ki bhi nahi sunta!')">
          "Ek Baar Commitment..."
        </button>

        <button class="sound-btn" onclick="playCatchphrase('sound-6', 'https://media.giphy.com/media/d1E2VyhFsxawRbe0/giphy.gif', 'Don ko pakadna mushkil hi nahi, namumkin hai!')">
          "Don Ko Pakadna..."
        </button>
      </div>

      <!-- Dynamic GIF Player -->
      <div class="gif-display-card">
        <p id="placeholder-text" style="color: #777;">Click any dialogue button above to play sound & GIF!</p>
        <img id="active-gif" src="" alt="Dad Catchphrase GIF">
        <div id="active-caption" class="gif-caption"></div>
      </div>
    </div>
  </section>

  <!-- Dynamic Quiz Section (Changes Every Time) -->
  <section>
    <h2 class="section-title">The "Dad Dialogue" Quiz ❓</h2>
    <div class="card">
      <p id="quiz-question" style="font-size: 1.1rem; font-weight: 700;"></p>
      <div id="quiz-options-container" class="quiz-options"></div>
      <div id="quiz-feedback"></div>
      <button class="next-quiz-btn" onclick="loadRandomQuestion()">Next Question 🎲</button>
    </div>
  </section>

  <footer>
    Made with ❤️ & Bollywood Swag for the world's best Dad!
  </footer>

  <script>
    // --- BGM Logic ---
    const bgAudio = document.getElementById('bg-audio');
    let isPlaying = false;

    function toggleBGM() {
      const btn = document.querySelector('.bg-music-btn');
      if (!isPlaying) {
        bgAudio.play();
        btn.innerText = '⏸ Pause Hero Theme Music';
        isPlaying = true;
        fireConfetti();
      } else {
        bgAudio.pause();
        btn.innerText = '▶ Pause Hero Theme Music';
        isPlaying = false;
      }
    }

    // --- Catchphrase Sound + GIF Logic ---
    function playCatchphrase(audioId, gifUrl, captionText) {
      ['sound-1', 'sound-2', 'sound-3', 'sound-4', 'sound-5', 'sound-6'].forEach(id => {
        const sound = document.getElementById(id);
        if (sound) {
          sound.pause();
          sound.currentTime = 0;
        }
      });

      const audio = document.getElementById(audioId);
      if (audio) audio.play();

      const gifImg = document.getElementById('active-gif');
      const gifCaption = document.getElementById('active-caption');
      const placeholder = document.getElementById('placeholder-text');

      placeholder.style.display = 'none';
      gifImg.src = gifUrl;
      gifImg.style.display = 'block';
      gifCaption.innerText = captionText;

      fireConfetti();
    }

    // --- DYNAMIC QUIZ DATASET ---
    const quizDataset = [
      {
        question: "When Dad says: 'Main gusse mein nahi bolta...', what does he mean?",
        options: [
          { text: "A) He is feeling calm and peaceful.", correct: false },
          { text: "B) 'Mera tone hi authoritative hai, order accept karo!'", correct: true },
          { text: "C) He forgot what he was saying.", correct: false }
        ]
      },
      {
        question: "What happens when someone sets the AC temperature to 18°C?",
        options: [
          { text: "A) Dad buys everyone warm blankets.", correct: false },
          { text: "B) Emergency red alert! Dad changes it back to 24°C in 0.5s.", correct: true },
          { text: "C) He enjoys the cool breeze.", correct: false }
        ]
      },
      {
        question: "When Dad says: 'Jis school mein tum padhte ho, uss school ka principal main hoon', he is referring to:",
        options: [
          { text: "A) His actual job.", correct: false },
          { text: "B) His superior life experience & street smarts.", correct: true },
          { text: "C) An email he received from your school.", correct: false }
        ]
      },
      {
        question: "Who holds the ultimate authority over the TV Remote?",
        options: [
          { text: "A) Whichever kid runs fastest.", correct: false },
          { text: "B) The Wifi router.", correct: false },
          { text: "C) Dad (It stays permanently near his sofa spot).", correct: true }
        ]
      },
      {
        question: "Dad's definition of 'Resting my eyes' actually means:",
        options: [
          { text: "A) Deep 2-hour snoring nap.", correct: true },
          { text: "B) Testing room lighting.", correct: false },
          { text: "C) Meditation practice.", correct: false }
        ]
      }
    ];

    let currentQuestionIndex = -1;

    function loadRandomQuestion() {
      const feedback = document.getElementById('quiz-feedback');
      feedback.innerText = '';

      // Pick a random index different from current one
      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * quizDataset.length);
      } while (newIndex === currentQuestionIndex && quizDataset.length > 1);

      currentQuestionIndex = newIndex;
      const qData = quizDataset[currentQuestionIndex];

      document.getElementById('quiz-question').innerText = qData.question;

      const container = document.getElementById('quiz-options-container');
      container.innerHTML = '';

      qData.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'quiz-btn';
        btn.innerText = opt.text;
        btn.onclick = () => checkQuiz(opt.correct);
        container.appendChild(btn);
      });
    }

    function checkQuiz(isCorrect) {
      const feedback = document.getElementById('quiz-feedback');
      if (isCorrect) {
        feedback.style.color = '#00ff88';
        feedback.innerText = '🎯 100% Correct! Dad rules supreme!';
        fireConfetti();
      } else {
        feedback.style.color = '#ff4444';
        feedback.innerText = '❌ Wrong answer! As Dad says: "Pehle dhyan se suno!"';
      }
    }

    // Initialize first question on load
    loadRandomQuestion();

    // Confetti Animation Effect
    function fireConfetti() {
      if (typeof confetti === 'function') {
        confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
      }
    }
  </script>
</body>
</html>
